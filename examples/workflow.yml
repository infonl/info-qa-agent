# Copy to .github/workflows/qa-agent.yml in your project and adjust the marked lines.
# For a test environment that needs setup steps first (e.g. a firewall), see workflow-with-setup.yml.
name: QA Agent

on:
  schedule:
    # Weekdays 05:30 UTC (07:30 Amsterdam in summer, 06:30 in winter). Tests the previous working day.
    - cron: "30 5 * * 1-5"
  workflow_dispatch:

jobs:
  qa-agent:
    uses: infonl/info-qa-agent/.github/workflows/qa-agent.yml@v1 # pin a commit SHA in production
    permissions:
      contents: read
      pull-requests: read
      # Copilot CLI requests are billed to the organization through the workflow token.
      copilot-requests: write
    with:
      app-url: https://test.example.com # ADJUST
      app-paths: "^src/" # ADJUST: which files count as application code
      jira-base-url: https://example.atlassian.net # ADJUST or remove
      jira-project-keys: ABC # ADJUST or remove
      slack-channel: C0123456789 # ADJUST or remove: the channel ID
    secrets:
      username: ${{ secrets.QA_USERNAME }}
      password: ${{ secrets.QA_PASSWORD }}
      jira-email: ${{ secrets.QA_AGENT_JIRA_EMAIL }}
      jira-api-token: ${{ secrets.QA_AGENT_JIRA_API_TOKEN }}
      slack-bot-token: ${{ secrets.QA_AGENT_SLACK_BOT_TOKEN }}
