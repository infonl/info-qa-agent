name: "INFO QA agent"
description: "An AI QA agent that tests the recently merged PRs of a project in the browser and writes a report."
author: "INFO"

inputs:
  app-url:
    description: "URL of the test environment the agent tests against"
    required: true
  username:
    description: "Username of the test user; the agent's tests read it as QA_USERNAME"
    default: ""
  password:
    description: "Password of the test user; the agent's tests read it as QA_PASSWORD"
    default: ""
  username-2:
    description: "Optional second test user (QA_USERNAME_2)"
    default: ""
  password-2:
    description: "Password of the optional second test user (QA_PASSWORD_2)"
    default: ""
  scope:
    description: "What to test: yesterday | <N>d | since:YYYY-MM-DD. yesterday is the previous working day."
    default: "yesterday"
  model:
    description: "Copilot model of the agent"
    default: "claude-haiku-5.5"
  language:
    description: "Language of the Slack message the agent writes"
    default: "English"
  locale:
    description: "Browser locale for the tests, e.g. nl-NL"
    default: "en-US"
  project-dir:
    description: "Folder in the repository with the project's markdown instructions; cleanup.md in it is used after the run"
    default: ".qa-agent"
  base-branch:
    description: "Branch the PRs are merged into"
    default: "main"
  app-paths:
    description: "Regex; a PR is tested when it changes a file matching it"
    default: "."
  skip-authors:
    description: "Comma separated PR authors to skip"
    default: "app/renovate,app/dependabot,renovate[bot],dependabot[bot]"
  max-prs:
    description: "Maximum number of PRs per run, newest first"
    default: "15"
  jira-base-url:
    description: "Optional Jira Cloud URL, e.g. https://example.atlassian.net"
    default: ""
  jira-project-keys:
    description: "Optional comma separated Jira project keys"
    default: ""
  jira-email:
    description: "Optional Jira account e-mail; only used before the agent starts"
    default: ""
  jira-api-token:
    description: "Optional Jira API token; only used before the agent starts"
    default: ""
  github-token:
    description: "Token for reading PRs and for Copilot; the workflow needs copilot-requests: write"
    default: ${{ github.token }}

outputs:
  pr-count:
    description: "Number of PRs the agent tested"
    value: ${{ steps.gather.outputs.pr_count }}

runs:
  using: composite
  steps:
    - name: Prepare the working directory
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.project-dir }}
        WORK: ${{ github.workspace }}/.qa-agent-run
      run: |
        rm -rf "$WORK"
        mkdir -p "$WORK/tests" "$WORK/output" "$WORK/project" "$WORK/auth"
        cp -R "$GITHUB_ACTION_PATH/runner/." "$WORK/"
        cp "$GITHUB_ACTION_PATH/instructions/AGENT.md" "$WORK/"
        if [[ -d "$PROJECT_DIR" ]]; then
          cp -R "$PROJECT_DIR/." "$WORK/project/"
        else
          echo "::warning::No $PROJECT_DIR folder; the agent learns the application from its source."
        fi
        echo "QA_AGENT_WORK=$WORK" >> "$GITHUB_ENV"

    - name: Gather merged PRs and tickets
      id: gather
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SCOPE: ${{ inputs.scope }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        APP_PATHS: ${{ inputs.app-paths }}
        SKIP_AUTHORS: ${{ inputs.skip-authors }}
        MAX_PRS: ${{ inputs.max-prs }}
        JIRA_BASE_URL: ${{ inputs.jira-base-url }}
        JIRA_PROJECT_KEYS: ${{ inputs.jira-project-keys }}
        JIRA_EMAIL: ${{ inputs.jira-email }}
        JIRA_API_TOKEN: ${{ inputs.jira-api-token }}
      run: OUT_DIR="$QA_AGENT_WORK/context" bash "$GITHUB_ACTION_PATH/scripts/gather.sh"

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: steps.gather.outputs.pr_count != '0'
      with:
        node-version: 24

    - name: Install Playwright and Copilot CLI
      if: steps.gather.outputs.pr_count != '0'
      shell: bash
      run: |
        cd "$QA_AGENT_WORK" && npm ci --ignore-scripts && npx playwright install --with-deps chromium
        npm install -g @github/copilot@1.0.103

    - name: Check that the test environment is up
      if: steps.gather.outputs.pr_count != '0'
      shell: bash
      env:
        QA_APP_URL: ${{ inputs.app-url }}
      run: curl -sS -o /dev/null --fail --max-time 30 --retry 3 "$QA_APP_URL"

    - name: Run the project's globalSetup
      id: setup
      if: steps.gather.outputs.pr_count != '0' && hashFiles(format('{0}/globalSetup.ts', inputs.project-dir)) != ''
      shell: bash
      working-directory: ${{ github.workspace }}/.qa-agent-run
      env:
        QA_APP_URL: ${{ inputs.app-url }}
        QA_LOCALE: ${{ inputs.locale }}
        QA_USERNAME: ${{ inputs.username }}
        QA_PASSWORD: ${{ inputs.password }}
        QA_USERNAME_2: ${{ inputs.username-2 }}
        QA_PASSWORD_2: ${{ inputs.password-2 }}
      # When it fails, the agent doesn't run; the report says it couldn't prepare the test environment.
      run: |
        if ! npm run global-setup 2>&1 | tee output/global-setup-log.txt; then
          echo "failed=true" >> "$GITHUB_OUTPUT"
          echo "::warning::globalSetup failed; see output/global-setup-log.txt. The agent doesn't run."
          printf '%s\n' '{"slack_message": "I couldn'"'"'t log in or prepare the test environment today, so I didn'"'"'t test anything.",' \
            ' "tickets": []}' > output/results.json
          printf '## No QA run today\n\nThe globalSetup of the project failed, so the agent did not run. See `output/global-setup-log.txt` in the artifact.\n' \
            > output/report.md
        fi

    - name: Run the QA agent
      if: steps.gather.outputs.pr_count != '0' && steps.setup.outputs.failed != 'true'
      shell: bash
      working-directory: ${{ github.workspace }}/.qa-agent-run
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        QA_APP_URL: ${{ inputs.app-url }}
        QA_LOCALE: ${{ inputs.locale }}
        QA_USERNAME: ${{ inputs.username }}
        QA_PASSWORD: ${{ inputs.password }}
        QA_USERNAME_2: ${{ inputs.username-2 }}
        QA_PASSWORD_2: ${{ inputs.password-2 }}
        MODEL: ${{ inputs.model }}
        LANGUAGE: ${{ inputs.language }}
        SINCE: ${{ steps.gather.outputs.since }}
        UNTIL: ${{ steps.gather.outputs.until }}
      # Copilot CLI can only allow file writes as a whole, not per folder. So globalTeardown is restored from
      # git before it runs, and the report action runs in a separate job.
      # There is deliberately no --max-ai-credits: with it, the model kept skipping tests to save budget.
      # The timeout of the calling job caps the cost instead.
      run: |
        # With saved sessions from globalSetup, the tests start logged in and need no passwords at all.
        if compgen -G "auth/*.json" > /dev/null; then
          unset QA_PASSWORD QA_PASSWORD_2
        fi
        copilot -p "Run a QA pass for the PRs merged from $SINCE to $UNTIL.
        Your working directory holds the QA files; the repository of the application is $GITHUB_WORKSPACE.
        Read AGENT.md and follow it. The gathered context is in context/manifest.md.
        Write the Slack message in $LANGUAGE.
        You are done when output/report.md exists and npm run check passes." \
          --add-dir "$GITHUB_WORKSPACE" \
          --model "$MODEL" \
          --allow-tool='write, shell(npm run:*)' \
          --no-ask-user \
          --no-custom-instructions \
          --disable-builtin-mcps \
          --no-auto-update \
          --usage-output-file output/copilot-usage.json \
          --share output/session.md \
          || echo "::warning::The QA agent ended with an error; the report shows what it finished."

    - name: Run the project's globalTeardown
      if: always() && steps.gather.outputs.pr_count != '0' && hashFiles(format('{0}/globalTeardown.ts', inputs.project-dir)) != ''
      shell: bash
      working-directory: ${{ github.workspace }}/.qa-agent-run
      env:
        PROJECT_DIR: ${{ inputs.project-dir }}
        QA_APP_URL: ${{ inputs.app-url }}
        QA_LOCALE: ${{ inputs.locale }}
        QA_USERNAME: ${{ inputs.username }}
        QA_PASSWORD: ${{ inputs.password }}
        QA_USERNAME_2: ${{ inputs.username-2 }}
        QA_PASSWORD_2: ${{ inputs.password-2 }}
      # The project files come from git, not from files the agent may have changed.
      run: |
        git -C "$GITHUB_WORKSPACE" checkout HEAD -- "$PROJECT_DIR"
        rm -rf project && mkdir project && cp -R "$GITHUB_WORKSPACE/$PROJECT_DIR/." project/
        npm run global-teardown 2>&1 | tee output/global-teardown-log.txt \
          || echo "::warning::globalTeardown failed; see output/global-teardown-log.txt."

    - name: Remove credentials from the evidence
      if: always() && steps.gather.outputs.pr_count != '0'
      shell: bash
      working-directory: ${{ github.workspace }}/.qa-agent-run
      env:
        QA_PASSWORD: ${{ inputs.password }}
        QA_PASSWORD_2: ${{ inputs.password-2 }}
      run: node "$GITHUB_ACTION_PATH/scripts/scrub-secrets.mjs" output tests

    - name: Upload the report, screenshots and tests
      if: always() && steps.gather.outputs.pr_count != '0'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: qa-agent-${{ github.run_id }}
        retention-days: 14
        path: |
          ${{ github.workspace }}/.qa-agent-run/output/
          ${{ github.workspace }}/.qa-agent-run/context/manifest.md
          ${{ github.workspace }}/.qa-agent-run/context/skipped.json
          ${{ github.workspace }}/.qa-agent-run/tests/
