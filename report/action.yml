name: "INFO QA agent report"
description: "Writes the report of an INFO QA agent run to the job summary and posts the agent's message to Slack."
author: "INFO"

# Run this in a separate job (needs: <the QA agent job>, if: always()). The agent can write anywhere on
# its own runner, so the Slack token must never be available there.

inputs:
  slack-bot-token:
    description: "Slack bot token with the chat:write scope; without it, only the job summary is written"
    default: ""
  slack-channel:
    description: "Slack channel ID (or name) to post in; invite the bot to it"
    default: ""
  jira-base-url:
    description: "Optional Jira Cloud URL; turns ticket keys in the Slack message into links"
    default: ""
  jira-project-keys:
    description: "Optional comma separated Jira project keys; limits which keys become links"
    default: ""
  scope:
    description: "Scope of the run, shown in the summary"
    default: "yesterday"
  model:
    description: "Model of the run, shown in the summary"
    default: "claude-haiku-5.5"
  language:
    description: "Language of the fixed Slack texts, such as the report link: Dutch or English"
    default: "English"

runs:
  using: composite
  steps:
    # Exists even when the agent job crashed before uploading anything, so the crash still gets reported.
    - name: Create the report directory
      shell: bash
      run: mkdir -p "$RUNNER_TEMP/qa-agent-report"

    - name: Download the report data
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: qa-agent-${{ github.run_id }}
        merge-multiple: true
        path: ${{ runner.temp }}/qa-agent-report

    - name: Write the job summary
      shell: bash
      working-directory: ${{ runner.temp }}/qa-agent-report
      env:
        SCOPE: ${{ inputs.scope }}
        MODEL: ${{ inputs.model }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/post-summary.sh"

    - name: Post to Slack
      shell: bash
      working-directory: ${{ runner.temp }}/qa-agent-report
      env:
        SLACK_BOT_TOKEN: ${{ inputs.slack-bot-token }}
        SLACK_CHANNEL: ${{ inputs.slack-channel }}
        JIRA_BASE_URL: ${{ inputs.jira-base-url }}
        JIRA_PROJECT_KEYS: ${{ inputs.jira-project-keys }}
        LANGUAGE: ${{ inputs.language }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/post-slack.sh"
