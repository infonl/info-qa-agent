name: "INFO QA agent report"
description: "Writes the report of an INFO QA agent run to the job summary and posts the agent's message to Slack."
author: "INFO"

# Run this in a separate job (needs: <the QA agent job>, if: always()). The agent can write anywhere on
# its own runner, so the Slack webhook must never be available there.

inputs:
  slack-webhook-url:
    description: "Slack incoming webhook; without it, only the job summary is written"
    default: ""
  jira-base-url:
    description: "Optional Jira Cloud URL; turns ticket keys in the Slack message into links"
    default: ""
  jira-project-keys:
    description: "Optional comma separated Jira project keys; limits which keys become links"
    default: ""
  scope:
    description: "Scope of the run, shown in the summary"
    default: "yesterday"
  model:
    description: "Model of the run, shown in the summary"
    default: "claude-haiku-5.5"
  suggest-instructions:
    description: "Open a draft PR with the agent's suggested improvements to the project's markdown files. The job needs contents: write and pull-requests: write."
    default: "false"
  project-dir:
    description: "Folder with the project's markdown files"
    default: ".qa-agent"
  github-token:
    description: "Token for opening the suggestion PR"
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # Exists even when the agent job crashed before uploading anything, so the crash still gets reported.
    - name: Create the report directory
      shell: bash
      run: mkdir -p "$RUNNER_TEMP/qa-agent-report"

    - name: Download the report data
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: qa-agent-${{ github.run_id }}
        merge-multiple: true
        path: ${{ runner.temp }}/qa-agent-report

    - name: Write the job summary
      shell: bash
      working-directory: ${{ runner.temp }}/qa-agent-report
      env:
        SCOPE: ${{ inputs.scope }}
        MODEL: ${{ inputs.model }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/post-summary.sh"

    - name: Post to Slack
      shell: bash
      working-directory: ${{ runner.temp }}/qa-agent-report
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.slack-webhook-url }}
        JIRA_BASE_URL: ${{ inputs.jira-base-url }}
        JIRA_PROJECT_KEYS: ${{ inputs.jira-project-keys }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/post-slack.sh"

    - name: Check out the project for the instruction suggestions
      if: inputs.suggest-instructions == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: qa-agent-project
        token: ${{ inputs.github-token }}

    - name: Suggest improvements to the instructions
      if: inputs.suggest-instructions == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SUGGESTIONS_DIR: ${{ runner.temp }}/qa-agent-report/output/instructions
        REPO_DIR: ${{ github.workspace }}/qa-agent-project
        PROJECT_DIR: ${{ inputs.project-dir }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/suggest-instructions.sh" || echo "::warning::Opening the instruction suggestion PR failed."
